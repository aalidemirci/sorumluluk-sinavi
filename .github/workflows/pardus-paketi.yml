# Pardus (.deb) paketini üretir ve yayım açıldığında ona ekler.
#
# Neden kap: glibc ileriye uyumludur, geriye değil. Ubuntu 24.04 koşucusunda
# (glibc 2.39) derlenen ikili Pardus 23'te (glibc 2.36) açılmaz. Bu yüzden
# yapım debian:12 kabında yapılır; çıkan paket Debian 12 ve üzerinde çalışır.
# Gerekçenin tamamı: kararlar/0009-pardus-paketi-pyinstaller-ile.md
#
# main'e her itmede de koşar (yalnız belge değişen itmeler hariç): paketleme
# yolunun bozulduğunu yayım gününde değil, bozulduğu gün öğrenmek gerekir.
#
# DİKKAT — yayım tetikleyicisi neden `release` olayı, etiket itmesi değil:
# `paths-ignore` yalnız `push` olayına takılıdır ama etiket itmesi de bir
# push'tur ve etiket, main zaten itildikten sonra konduğu için o push'ta
# değişen dosya yoktur. Süzgeçle birlikte etiket itmesi sessizce atlanır,
# yani paket hiç üretilmez. `release: published` süzgeçten etkilenmez;
# yayımı açtığınız anda paket üretilip ona eklenir.

name: Pardus paketi

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "NOTICE"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  paket:
    name: .deb üret (Debian 12)
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      # libpython3.11: Debian'ın python3 paketi paylaşımlı kitaplığı
      # (libpython3.11.so.1.0) taşımaz, PyInstaller onsuz derleyemez.
      # libgl1 … libxcb-xkb1: Qt'nin X11 eklentisinin kitaplıkları. Kapta
      # kurulu olanlar pakete girer; eksik olanı yapim/deb_paketi.py yakalar
      # ve derlemeyi durdurur. Liste o betiğin belgesindekiyle aynıdır.
      - name: Kap bağımlılıkları
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates python3 python3-venv libpython3.11 \
            dpkg-dev binutils tzdata \
            libgl1 libegl1 libfontconfig1 libdbus-1-3 libglib2.0-0 libxkbcommon0 \
            libxkbcommon-x11-0 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1

      - uses: actions/checkout@v7

      - name: Sanal ortam
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e . pyinstaller

      - name: Paketi üret
        run: .venv/bin/python yapim/deb_paketi.py

      - name: Paket içeriğini göster
        run: |
          dpkg-deb --info dist-kurulum/*.deb
          dpkg-deb --contents dist-kurulum/*.deb | grep -v '/opt/sorumluluk-sinavi/_internal/'

      - uses: actions/upload-artifact@v7
        with:
          name: pardus-deb
          path: dist-kurulum/*
          retention-days: 30

  # Kurulum denemesi TEMİZ kapta yapılır: derleme kabında Qt'nin bütün
  # kitaplıkları kurulu olduğu için eksik bir Depends satırı orada görünmez.
  # Burada yalnız paket ve sanal ekran kurulur; Depends'i apt çeker.
  deneme:
    name: Temiz Debian 12'de kur ve aç
    needs: paket
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pardus-deb
          path: paket

      # xauth: xvfb-run onsuz "xauth command not found" der.
      - name: Kur ve aç
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./paket/*.deb xvfb xauth
          test -x /usr/bin/sorumluluk-sinavi
          test -f /usr/share/applications/sorumluluk-sinavi.desktop
          # Uygulama penceresi açıp beklediği için normal çıkışı yoktur:
          # 124 (timeout) beklenen sonuçtur, başka her kod açılış hatasıdır
          # (ör. Qt'nin X11 eklentisi yüklenemezse 134).
          set +e
          SORUMLULUK_VERI_KLASORU=/tmp/ss-deneme SORUMLULUK_GUNCELLEME_DENETIMI=0 \
            timeout 30 xvfb-run -a /usr/bin/sorumluluk-sinavi
          durum=$?
          set -e
          test "$durum" -eq 124 || { echo "uygulama açılamadı (çıkış $durum)"; exit 1; }
          test -f /tmp/ss-deneme/sorumluluk.db

  yayim:
    name: Sürüm yayımına ekle
    needs: [paket, deneme]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pardus-deb
          path: paket

      # Yayım Windows paketleriyle elle açılır; buradaki iş yalnızca Pardus
      # dosyalarını o yayıma eklemektir. --clobber yeniden derlemede aynı adı
      # üzerine yazar.
      - name: Yayıma yükle
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKET: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$ETIKET" paket/* --repo "$GITHUB_REPOSITORY" --clobber
