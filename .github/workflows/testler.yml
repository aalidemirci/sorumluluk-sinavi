# Testler her itmede ve her birleştirme isteğinde koşar.
#
# İki ayak vardır ve ikisi de gereklidir:
#   * windows — uygulamanın dağıtıldığı platform. Paket 3.11 ile derlenir;
#     3.12 ileriye dönük kırılmayı erken görmek içindir.
#   * pardus  — Pardus 23'ün tabanı olan Debian 12 kabı. Arayüz testleri Qt'yi
#     ekransız (offscreen) kipte kurar, xvfb gerekmez; ama Qt'nin yüklenmesi
#     için GL, xkbcommon, fontconfig, D-Bus ve GLib kitaplıkları kurulu
#     olmalıdır. DejaVu, Pardus'un varsayılan yazı tipidir.
#
# Ağ isteği yasağı uygulamaya aittir, yapım ortamına değil: bağımlılıklar
# burada PyPI'dan kurulur.

name: Testler

# paths-ignore: yalnız belge değiştiren itmelerde koşmaz. Listeye kod, test,
# `.gitignore` ya da iş akışı dosyaları GİRMEZ — `.gitignore` değişikliği
# test_gizlilik.py'yi doğrudan ilgilendirir.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "NOTICE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "NOTICE"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows • Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Testler
        run: python -m pytest

  pardus:
    name: Pardus 23 tabanı (Debian 12)
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      # git, checkout eyleminin depoyu tarball yerine klon olarak almasını
      # sağlar; test_gizlilik.py izlenen dosya listesini git'ten okur, git
      # yoksa o testler atlanır ve KVKK denetimi sessizce kaybolur.
      - name: Kap bağımlılıkları
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates python3 python3-venv tzdata \
            libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 fonts-dejavu-core

      - uses: actions/checkout@v7

      # Kapta root'uz, çalışma klasörü ise koşucunun kullanıcısına ait: git
      # bu uyumsuzluğu "dubious ownership" sayıp 128 ile çıkıyor.
      # test_gizlilik.py izlenen dosya listesini git'ten okuduğu için bu
      # ayar olmadan KVKK denetimleri kırılır.
      - name: git güven ayarı
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Sanal ortam
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[test]"

      - name: Testler
        run: .venv/bin/python -m pytest
