[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sorumluluk-sinavi"
# Sürüm tek yerde: cekirdek/surum.py
dynamic = ["version"]
description = "Çevrimdışı sorumluluk sınavı planlama ve görevlendirme uygulaması"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "xlrd==2.0.2",
  "tzdata>=2026.1",
  # Tam sabit: NOTICE dağıtılan Qt sürümünü ve kaynak kodu adresini yazar
  # (LGPL-3.0). Yükseltirken NOTICE ve yardım metni de değişir; test_lisans.py
  # ikisinin ayrışmasını engeller.
  "PySide6-Essentials==6.11.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-qt>=4.4,<5"]
build-windows = ["pyinstaller>=6,<7"]
araclar = ["pillow>=10,<12"]

[project.scripts]
sorumluluk-sinavi = "sorumluluk_sinavi:main"

[tool.setuptools.dynamic]
version = {attr = "cekirdek.surum.SURUM"}

[tool.setuptools]
py-modules = ["sorumluluk_sinavi"]
packages = ["cekirdek", "veri", "veri.hizmet", "evrak", "arayuz", "arayuz.sayfalar"]

[tool.pytest.ini_options]
testpaths = ["testler"]
addopts = "-q"
cache_dir = "build/pytest-cache"
